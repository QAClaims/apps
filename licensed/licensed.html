<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Licensed? — claim check</title>
<style>
  :root {
    --ink: #1c1c1c; --muted: #5d5d5d; --line: #c9c9c9; --field: #ffffff; --page: #f5f5f3;
    --red: #b3261e; --red-ink: #ffffff; --green: #1e7a3c; --green-ink: #ffffff;
    --amber: #8a5a00; --amber-bg: #fff4d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 .25rem; }
  p.lead { margin: 0 0 1.25rem; color: var(--muted); }
  label { display: block; margin: 1rem 0 .3rem; font-weight: 600; }
  label small { display: block; font-weight: 400; color: var(--muted); }
  input { width: 100%; font: inherit; padding: .65rem .7rem; border: 1px solid var(--line);
    border-radius: 6px; background: var(--field); color: var(--ink); }
  input:focus { outline: 3px solid #2b5fb4; outline-offset: 1px; }
  button { margin-top: 1.25rem; width: 100%; font: inherit; font-weight: 600; padding: .8rem;
    border: 0; border-radius: 6px; background: var(--ink); color: #fff; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 3px solid #2b5fb4; outline-offset: 2px; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; padding: 1rem; cursor: pointer; z-index: 10; }
  #scrim.open { display: flex; }
  #verdict { width: 100%; max-width: 34rem; border-radius: 10px; padding: 1.4rem 1.5rem; }
  #verdict.red { background: var(--red); color: var(--red-ink); }
  #verdict.green { background: var(--green); color: var(--green-ink); }
  #verdict.amber { background: var(--amber-bg); color: var(--amber); border: 2px solid var(--amber); }
  #verdict h2 { margin: 0 0 .7rem; font-size: 1.6rem; line-height: 1.2; }
  #verdict ul { margin: 0; padding-left: 1.2rem; font-size: 1.05rem; }
  #verdict li { margin: .3rem 0; }
  #verdict li.bad { font-weight: 700; }
  #verdict li.warn { background: var(--amber-bg); color: var(--amber); border: 2px solid var(--amber);
    border-radius: 6px; padding: .35rem .6rem; margin-left: -1.2rem; list-style: none; font-weight: 600; }
  #verdict p.hint { margin: 1rem 0 0; font-size: .9rem; opacity: .85; }
  #status { margin-top: .75rem; min-height: 1.4rem; color: var(--muted); }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Licensed?</h1>
  <p class="lead">Checks a claim's policy state, vehicle state, and shop state against your license list. Nothing you type in the three claim fields leaves this page.</p>

  <label for="alias">Your alias<small>4–6 characters</small></label>
  <input id="alias" autocomplete="username" autocapitalize="characters" spellcheck="false" maxlength="6">

  <label for="claim">Claim number<small>the first two characters set the policy state</small></label>
  <input id="claim" autocomplete="off" spellcheck="false" inputmode="text">

  <label for="vehicle">Vehicle location<small>a state, or an address ending in state and ZIP</small></label>
  <input id="vehicle" autocomplete="off" spellcheck="false">

  <label for="shop">Shop location<small>optional — leave blank if there is no shop yet</small></label>
  <input id="shop" autocomplete="off" spellcheck="false">

  <button id="check" type="button">Check licenses</button>
  <div id="status" role="status" aria-live="polite"></div>

  <div id="scrim" aria-hidden="true">
    <section id="verdict" role="dialog" tabindex="-1" aria-modal="true" aria-live="assertive"></section>
  </div>

  <footer>licensed.html v0.1.3 · prototype 1 · QAClaims apps</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- configuration -------------------------------------------------------
  // The publishable key is designed to ship in the page; row-level security is
  // the gate. Prototype 1 has one anon read policy on state_prefixes.
  var SB_URL = "https://fiplphpjzhbjvdazwsqf.supabase.co";
  var SB_KEY = "sb_publishable_5eipHD0mJEzc6BSiGX6LLg_aV-MYZyv";
  var TABLE = "state_prefixes";

  var STATES = ("AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV " +
                "NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY").split(" ");

  // ---- pure logic (no DOM, no network) ------------------------------------
  // Last token that is a valid two-letter state code. Tolerates a bare state,
  // "City, ST 12345", "City, ST 12345-6789", full address lines, trailing
  // punctuation, and any case.
  function stateFromLocation(text) {
    var tokens = String(text || "").toUpperCase().replace(/[^A-Z0-9\s]/g, " ").trim().split(/\s+/);
    for (var i = tokens.length - 1; i >= 0; i--) {
      if (STATES.indexOf(tokens[i]) !== -1) return tokens[i];
    }
    return null;
  }

  // First two characters of the claim number, whatever follows them.
  function prefixFromClaim(text) {
    var s = String(text || "").trim();
    return s.length >= 2 ? s.slice(0, 2) : null;
  }

  // rows: [{state, prefix, licensed}] for one alias. Returns the verdict.
  function evaluate(rows, claim, vehicle, shop) {
    var byPrefix = {}, byState = {};
    rows.forEach(function (r) {
      byPrefix[r.prefix] = r;
      // A state with several prefixes shares one licensed value; keep the first.
      if (!byState[r.state]) byState[r.state] = r;
    });

    var checks = [];

    var prefix = prefixFromClaim(claim);
    var prow = prefix ? byPrefix[prefix] : null;
    checks.push({
      field: "Policy state (claim prefix " + (prefix || "?") + ")",
      state: prow ? prow.state : null,
      licensed: prow ? prow.licensed : null,
      problem: !prefix ? "claim number too short" : (!prow ? "prefix " + prefix + " is not in your table" : null)
    });

    [["Vehicle state", vehicle], ["Shop state", shop]].forEach(function (pair) {
      var raw = String(pair[1] || "").trim();
      // Shop location is optional: blank means "not checked", shown as a warning
      // line inside whatever the other fields decide, never as a failure.
      if (pair[0] === "Shop state" && raw === "") {
        checks.push({ field: pair[0], state: null, licensed: null, problem: null, skipped: true });
        return;
      }
      var st = stateFromLocation(raw);
      var row = st ? byState[st] : null;
      checks.push({
        field: pair[0],
        state: st,
        licensed: row ? row.licensed : null,
        problem: !st ? "no state found in \"" + raw + "\"" : (!row ? st + " is not in your table" : null)
      });
    });

    var unresolved = checks.filter(function (c) { return c.problem; });
    var blocked = checks.filter(function (c) { return c.licensed === "NO"; });

    return {
      outcome: blocked.length ? "red" : (unresolved.length ? "amber" : "green"),
      checks: checks, blocked: blocked, unresolved: unresolved
    };
  }

  // Exposed for headless tests; harmless in the browser.
  if (typeof module !== "undefined" && module.exports) {
    module.exports = { stateFromLocation: stateFromLocation, prefixFromClaim: prefixFromClaim, evaluate: evaluate };
    return;
  }

  // ---- page --------------------------------------------------------------
  var $ = function (id) { return document.getElementById(id); };
  var client = window.supabase.createClient(SB_URL, SB_KEY);
  var cache = { alias: null, rows: null };

  function say(msg) { $("status").textContent = msg || ""; }

  function render(alias, v) {
    var box = $("verdict");
    box.className = v.outcome;
    var title;
    if (v.outcome === "green") title = "Licenses confirmed — adjuster " + alias + " can handle this claim.";
    else if (v.outcome === "red") title = "Adjuster " + alias + " is not licensed to handle this claim.";
    else title = "Could not confirm — a field did not resolve to a state.";

    var items = v.checks.map(function (c) {
      var text;
      if (c.skipped) return "<li class=\"warn\">" + escapeHtml(c.field + ": not entered — not checked") + "</li>";
      if (c.problem) text = c.field + ": " + c.problem;
      else if (c.licensed === "NO") text = c.field + ": " + c.state + " — NOT licensed";
      else if (c.licensed === "N/A") text = c.field + ": " + c.state + " — no license required";
      else text = c.field + ": " + c.state + " — licensed";
      var cls = (c.problem || c.licensed === "NO") ? ' class="bad"' : "";
      return "<li" + cls + ">" + escapeHtml(text) + "</li>";
    }).join("");

    box.innerHTML = "<h2>" + escapeHtml(title) + "</h2><ul>" + items + "</ul>" +
      "<p class=\"hint\">Tap or press any key to go back.</p>";
    $("scrim").className = "open";
    $("scrim").setAttribute("aria-hidden", "false");
    box.focus();
  }

  // Any click or key clears the result and returns to entry: alias stays,
  // the three claim fields clear, focus lands on the claim number.
  function dismiss() {
    var scrim = $("scrim");
    if (scrim.className !== "open") return;
    scrim.className = "";
    scrim.setAttribute("aria-hidden", "true");
    $("verdict").className = ""; $("verdict").innerHTML = "";
    ["claim", "vehicle", "shop"].forEach(function (id) { $(id).value = ""; });
    $("claim").focus();
  }
  $("scrim").addEventListener("click", dismiss);
  document.addEventListener("keydown", function (e) {
    if ($("scrim").className === "open") { e.preventDefault(); dismiss(); }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  // Loads the alias's rows once; later checks are local until the alias changes.
  // The only thing ever sent is the alias.
  async function rowsFor(alias) {
    if (cache.alias === alias && cache.rows) return cache.rows;
    say("Loading license table for " + alias + "…");
    var res = await client.from(TABLE).select("state,prefix,licensed").eq("alias", alias);
    if (res.error) throw new Error("Could not read the license table: " + res.error.message);
    if (!res.data || res.data.length === 0) throw new Error("No license table for alias \"" + alias + "\". Check the spelling, or ask for your alias to be added.");
    cache = { alias: alias, rows: res.data.map(function (r) {
      return { state: String(r.state).trim(), prefix: String(r.prefix).trim(), licensed: String(r.licensed).trim() };
    }) };
    return cache.rows;
  }

  $("check").addEventListener("click", async function () {
    var alias = $("alias").value.trim().toUpperCase();
    if (alias.length < 4 || alias.length > 6) { say("Enter your alias — 4 to 6 characters."); $("alias").focus(); return; }
    $("check").disabled = true;
    try {
      var rows = await rowsFor(alias);
      say("");
      render(alias, evaluate(rows, $("claim").value, $("vehicle").value, $("shop").value));
    } catch (e) {
      say(e.message);
    } finally {
      $("check").disabled = false;
    }
  });

  // Enter moves to the next field; Enter in the last field runs the check.
  var order = ["alias", "claim", "vehicle", "shop"];
  order.forEach(function (id, i) {
    $(id).addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      // Stop here: the same keystroke must not reach the page-level listener,
      // which would otherwise dismiss the popup this Enter is about to open.
      e.stopPropagation();
      if (i < order.length - 1) $(order[i + 1]).focus(); else $("check").click();
    });
  });
})();
</script>
</body>
</html>
